{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="gm-card">
            <div class="p-3 p-lg-4">
                <h4>{% trans "Report Profile" %}: {{ reported_profile.full_name }}</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn gm-btn-primary">{% trans "Submit Report" %}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
