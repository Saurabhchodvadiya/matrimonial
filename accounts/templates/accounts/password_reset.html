{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="gm-card">
            <div class="p-4">
                <h3>{% trans "Forgot Password" %}</h3>
                <p class="gm-muted">{% trans "Enter your account email to receive reset instructions." %}</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn gm-btn-primary">{% trans "Send Reset Link" %}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
