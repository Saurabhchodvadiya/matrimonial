{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="gm-form-panel">
    <div class="gm-card p-4">
        <h3 class="text-center mb-1">{% trans "Welcome back" %}</h3>
        <p class="tiny text-center gm-muted mb-4">{% trans "Sign in to view your matches" %}</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn gm-btn-primary w-100">{% trans "Sign in" %}</button>
        </form>
        <div class="mt-3 d-flex justify-content-between tiny">
            <a href="{% url 'accounts:password_reset' %}">{% trans "Forgot your password?" %}</a>
            <a href="{% url 'accounts:register' %}">{% trans "Create a new profile" %}</a>
        </div>
    </div>
</div>
{% endblock %}
