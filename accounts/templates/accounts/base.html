<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gujarati Matrimonial</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f9; color: #222; }
        header { background: #8b0000; color: #fff; padding: 14px 20px; }
        nav a { color: #fff; margin-right: 12px; text-decoration: none; font-weight: 600; }
        main { max-width: 960px; margin: 24px auto; background: #fff; padding: 20px; border-radius: 8px; }
        input, select, textarea, button { width: 100%; padding: 8px; margin-top: 6px; margin-bottom: 12px; }
        button { background: #8b0000; border: none; color: #fff; cursor: pointer; border-radius: 4px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #fff; }
        .muted { color: #666; font-size: 0.9rem; }
        .error { color: #b00020; font-weight: 600; }
        .success { color: #0c7a24; font-weight: 600; }
    </style>
</head>
<body>
<header>
    <nav>
        <a href="/">Home</a>
        <a href="/register/">Register</a>
        <a href="/login/">Login</a>
        <a href="/dashboard/">Dashboard</a>
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
