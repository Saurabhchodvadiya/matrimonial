{% extends "accounts/base.html" %}

{% block content %}
<h2>My Matrimonial Profile</h2>
<p class="muted">After login, update caste, religion, biodata and photo.</p>
<p id="status" class="muted"></p>

<form id="profile-form" enctype="multipart/form-data">
    <div class="row">
        <div>
            <label>Full Name</label>
            <input name="full_name">
        </div>
        <div>
            <label>Age</label>
            <input name="age" type="number" min="18" max="100">
        </div>
    </div>
    <div class="row">
        <div>
            <label>Gender</label>
            <select name="gender">
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            <label>City</label>
            <input name="city">
        </div>
    </div>
    <div class="row">
        <div>
            <label>Religion</label>
            <input name="religion">
        </div>
        <div>
            <label>Caste</label>
            <input name="caste">
        </div>
    </div>
    <label>Biodata</label>
    <textarea name="biodata" rows="4"></textarea>
    <label>Photo</label>
    <input name="photo" type="file" accept="image/*">
    <button type="submit">Save Profile</button>
</form>

<hr>
<h3>Public Profiles</h3>
<div id="profiles" class="grid"></div>

<script>
const statusEl = document.getElementById("status");
const accessToken = localStorage.getItem("accessToken");

if (!accessToken) {
    statusEl.className = "error";
    statusEl.textContent = "Please login first.";
}

const profileForm = document.getElementById("profile-form");

const authorizedFetch = async (url, options = {}) => {
    const headers = options.headers || {};
    headers.Authorization = `Bearer ${localStorage.getItem("accessToken")}`;
    return fetch(url, { ...options, headers });
};

const loadMyProfile = async () => {
    const response = await authorizedFetch("/api/profiles/me/");
    if (!response.ok) {
        statusEl.className = "error";
        statusEl.textContent = "Session expired. Please login again.";
        return;
    }
    const data = await response.json();
    Object.entries(data).forEach(([key, value]) => {
        const field = profileForm.elements[key];
        if (field && field.type !== "file") {
            field.value = value ?? "";
        }
    });
};

profileForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    statusEl.className = "muted";
    statusEl.textContent = "Saving profile...";
    const formData = new FormData(profileForm);
    if (!formData.get("photo") || !formData.get("photo").name) {
        formData.delete("photo");
    }

    const response = await authorizedFetch("/api/profiles/me/", {
        method: "PUT",
        body: formData,
    });
    const data = await response.json();

    if (!response.ok) {
        statusEl.className = "error";
        statusEl.textContent = JSON.stringify(data);
        return;
    }
    statusEl.className = "success";
    statusEl.textContent = "Profile updated successfully.";
    await loadPublicProfiles();
});

const loadPublicProfiles = async () => {
    const response = await fetch("/api/profiles/");
    const profiles = await response.json();
    const container = document.getElementById("profiles");
    container.innerHTML = "";

    profiles.forEach((profile) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <h4>${profile.full_name || profile.username}</h4>
            <p><strong>Religion:</strong> ${profile.religion || "-"}</p>
            <p><strong>Caste:</strong> ${profile.caste || "-"}</p>
            <p><strong>City:</strong> ${profile.city || "-"}</p>
            <p class="muted">${profile.biodata || ""}</p>
            ${profile.photo_url ? `<img src="${profile.photo_url}" alt="profile photo" style="width:100%;border-radius:6px">` : ""}
        `;
        container.appendChild(card);
    });
};

loadMyProfile();
loadPublicProfiles();
</script>
{% endblock %}
