{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="gm-form-panel">
    <div class="gm-card p-4">
        <h3 class="text-center mb-1">{% trans "Create your free profile" %}</h3>
        <p class="tiny text-center gm-muted mb-4">{% trans "This takes only a few minutes and helps families connect better." %}</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn gm-btn-primary w-100">{% trans "Create my profile" %}</button>
        </form>
        <div class="mt-3 text-center tiny">
            <a href="{% url 'accounts:login' %}">{% trans "Already have a profile? Sign in" %}</a>
        </div>
    </div>
</div>
{% endblock %}
